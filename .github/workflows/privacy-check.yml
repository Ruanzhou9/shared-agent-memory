name: privacy-check

# 每次 push / PR 自动扫描仓库内容，防止个人信息（真实身份、绝对路径、凭证、
# 个人项目痕迹）被误提交到公开仓库。
# 说明：不检查 git 提交作者——公开仓库里贡献者用真实署名是正常且合理的，
#       只扫描文件内容本身的泄漏。

on:
  push:
  pull_request:

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan content for personal-data leaks
        run: |
          EXIT=0
          # 真实身份 / 邮箱 / 用户名
          if grep -rniE "bhwcy|eeph@|@126\.com|Ruanzhou9" --include='*' . | \
             grep -v '^\./\.git/' | grep -v '^\./scripts/pre-push-check.sh:' | grep -v '^\./\.github/workflows/privacy-check.yml:' ; then
            echo "::error::发现可能泄漏身份/邮箱/用户名的内容"; EXIT=1
          fi
          # 绝对用户路径
          if grep -rn "Users/" --include='*' . | \
             grep -v '^\./\.git/' | grep -v '^\./scripts/pre-push-check.sh:' | grep -v '^\./\.github/workflows/privacy-check.yml:'; then
            echo "::error::发现可能泄漏绝对路径(Users/)的内容"; EXIT=1
          fi
          # 凭证 / 密钥
          if grep -rniE "sk-[A-Za-z0-9]{16}|api[_-]?key[=:][[:space:]]*[A-Za-z0-9]{12}|AKIA[0-9A-Z]{10}|BEGIN (PRIVATE|RSA|EC|OPENSSH) KEY" --include='*' . | \
             grep -v '^\./\.git/' | grep -v '^\./\.github/workflows/privacy-check.yml:'; then
            echo "::error::发现疑似真实密钥/凭证"; EXIT=1
          fi
          # 个人项目 / 软件使用痕迹
          if grep -rniE "voice-clone|local-ai-doctor|obsidian-content-capture|douyin|wechat|抖音|微信" --include='*' . | \
             grep -v '^\./\.git/' ; then
            echo "::error::发现可识别个人项目或使用痕迹"; EXIT=1
          fi
          if [ "$EXIT" -eq 0 ]; then echo "✅ 未发现个人信息泄漏"; fi
          exit $EXIT
