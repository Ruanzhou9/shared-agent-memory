<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" font-family="'PingFang SC','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f8fb"/>
      <stop offset="100%" stop-color="#eef1f6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f5bd5"/>
      <stop offset="100%" stop-color="#7c5cd6"/>
    </linearGradient>
  </defs>

  <rect width="860" height="560" rx="16" fill="url(#bg)"/>
  <text x="30" y="42" font-size="22" font-weight="700" fill="#23263b">Shared Agent Memory · 跨 Agent 共享记忆</text>
  <text x="30" y="66" font-size="13" fill="#5b6072">任意读取 SKILL.md 的 agent 共享同一份长期记忆，跨会话自动沉淀与复用</text>

  <!-- Left: multiple agents -->
  <g>
    <text x="52" y="120" font-size="13" font-weight="600" fill="#5b6072">任意 Agent</text>
    <g rx="10">
      <rect x="40"  y="134" width="150" height="42" rx="8" fill="#ffffff" stroke="#c7cbe0"/>
      <text x="115" y="160" text-anchor="middle" font-size="12" fill="#3a3f56">OpenCode</text>
    </g>
    <rect x="40"  y="190" width="150" height="42" rx="8" fill="#ffffff" stroke="#c7cbe0"/><text x="115" y="216" text-anchor="middle" font-size="12" fill="#3a3f56">Codex</text>
    <rect x="40"  y="246" width="150" height="42" rx="8" fill="#ffffff" stroke="#c7cbe0"/><text x="115" y="272" text-anchor="middle" font-size="12" fill="#3a3f56">Claude Code</text>
    <rect x="40"  y="302" width="150" height="42" rx="8" fill="#ffffff" stroke="#c7cbe0"/><text x="115" y="328" text-anchor="middle" font-size="12" fill="#3a3f56">Hermes</text>
    <rect x="40"  y="358" width="150" height="42" rx="8" fill="#ffffff" stroke="#c7cbe0"/><text x="115" y="384" text-anchor="middle" font-size="12" fill="#3a3f56">OpenClaw</text>
    <rect x="40"  y="414" width="150" height="42" rx="8" fill="#ffffff" stroke="#c7cbe0"/><text x="115" y="440" text-anchor="middle" font-size="12" fill="#3a3f56">Cursor / Harness</text>
  </g>

  <!-- arrows agents -> skill -->
  <g stroke="#7c5cd6" stroke-width="2" fill="none">
    <path d="M190 155 Q235 155 250 235" marker-end="url(#arr)"/>
    <path d="M190 211 L250 211" marker-end="url(#arr)"/>
    <path d="M190 267 L250 267" marker-end="url(#arr)"/>
    <path d="M190 323 Q235 323 235 300" marker-end="url(#arr)" transform="translate(0,0)"/>
    <path d="M190 379 L250 379" marker-end="url(#arr)"/>
    <path d="M190 435 Q235 435 250 355" marker-end="url(#arr)"/>
  </g>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7c5cd6"/></marker>
  </defs>

  <!-- center: SKILL protocol -->
  <rect x="252" y="120" width="200" height="330" rx="12" fill="url(#accent)"/>
  <text x="352" y="168" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">SKILL.md</text>
  <text x="352" y="192" text-anchor="middle" font-size="12" fill="#ded6ff">读写协议</text>
  <line x1="270" y1="212" x2="434" y2="212" stroke="#ffffff" stroke-opacity="0.35"/>
  <text x="352" y="242" text-anchor="middle" font-size="12" fill="#ffffff">· 读取 persona</text>
  <text x="352" y="268" text-anchor="middle" font-size="12" fill="#ffffff">· 检索原子记忆</text>
  <text x="352" y="294" text-anchor="middle" font-size="12" fill="#ffffff">· 写入新偏好</text>
  <text x="352" y="320" text-anchor="middle" font-size="12" fill="#ffffff">· 省 Token 门控</text>
  <text x="352" y="346" text-anchor="middle" font-size="12" fill="#ffffff">· 自动归并压缩</text>
  <text x="352" y="392" text-anchor="middle" font-size="11" fill="#c9c0ee">对所有 agent 用同一套规则</text>

  <!-- arrows skill -> memory -->
  <g stroke="#4f5bd5" stroke-width="2" fill="none">
    <path d="M452 190 L500 190" marker-end="url(#arr2)"/>
    <path d="M452 280 L500 280" marker-end="url(#arr2)"/>
    <path d="M452 370 L500 370" marker-end="url(#arr2)"/>
  </g>
  <defs><marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4f5bd5"/></marker></defs>

  <!-- right: memory store -->
  <rect x="502" y="108" width="326" height="360" rx="12" fill="#ffffff" stroke="#c7cbe0"/>
  <text x="665" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#23263b">共享记忆库（Markdown 文件夹）</text>

  <rect x="518" y="156" width="294" height="52" rx="8" fill="#f0f1fb" stroke="#d6d8ed"/>
  <text x="530" y="180" font-size="12" font-weight="700" fill="#3a3f56">persona.md · L3 画像</text>
  <text x="530" y="198" font-size="11" fill="#6a6f84">稳定偏好 / 风格 / 处理方式（每次会话读）</text>

  <rect x="518" y="216" width="294" height="52" rx="8" fill="#f0f1fb" stroke="#d6d8ed"/>
  <text x="530" y="240" font-size="12" font-weight="700" fill="#3a3f56">atoms/ · L1 原子记忆</text>
  <text x="530" y="258" font-size="11" fill="#6a6f84">一条一文件：preference / fact / handling / constraint</text>

  <rect x="518" y="276" width="294" height="52" rx="8" fill="#f0f1fb" stroke="#d6d8ed"/>
  <text x="530" y="300" font-size="12" font-weight="700" fill="#3a3f56">scenes/ · L2 场景块</text>
  <text x="530" y="318" font-size="11" fill="#6a6f84">相关原子凝聚成的可复用经验</text>

  <rect x="518" y="336" width="294" height="40" rx="8" fill="#f8f8fb" stroke="#e2e4f0"/>
  <text x="530" y="360" font-size="11" font-weight="700" fill="#6a6f84">chat-log/ · L0 摘要指针</text>

  <text x="665" y="408" text-anchor="middle" font-size="11" fill="#8b90a5">可同步到 Obsidian / git，也可做成个人私库</text>

  <text x="430" y="520" text-anchor="middle" font-size="12" font-weight="600" fill="#5b6072">一次写入，全 Agent 复用 —— 用户不必每次重复自己的偏好与处理方式</text>
</svg>
