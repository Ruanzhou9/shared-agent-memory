<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" font-family="'PingFang SC','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fc"/>
      <stop offset="100%" stop-color="#eef1f7"/>
    </linearGradient>
    <linearGradient id="g0" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7f8ea0"/><stop offset="100%" stop-color="#9aa7b6"/></linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#5aa9c9"/><stop offset="100%" stop-color="#79c0dd"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#8a69d4"/><stop offset="100%" stop-color="#a987ef"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#e06a8a"/><stop offset="100%" stop-color="#ef8aa5"/></linearGradient>
  </defs>

  <rect width="880" height="520" rx="16" fill="url(#pbg)"/>
  <text x="30" y="40" font-size="20" font-weight="700" fill="#23263b">分层记忆处理管道（借鉴 TencentDB-Agent-Memory 思路）</text>
  <text x="30" y="64" font-size="13" fill="#5b6072">原始对话 → 逐层提炼 → 跨会话注入复用；只注入精华，不灌全量历史，控制 Token</text>

  <!-- L0 -->
  <rect x="40" y="120" width="760" height="70" rx="10" fill="url(#g0)"/>
  <text x="60" y="152" font-size="15" font-weight="700" fill="#ffffff">L0 · 原始对话</text>
  <text x="60" y="176" font-size="12" fill="#eef1f6">与 agent 的聊天记录 · 仅存"摘要 + 日志指针"，原文留在各 agent 会话存档，不进库</text>

  <path d="M420 190 L420 215" stroke="#8896a8" stroke-width="2"/> 
  <path d="M410 215 L420 225 L430 215 Z" fill="#8896a8"/>

  <!-- L1 -->
  <rect x="190" y="230" width="460" height="70" rx="10" fill="url(#g1)"/>
  <text x="210" y="262" font-size="15" font-weight="700" fill="#ffffff">L1 · 原子记忆（atoms/）</text>
  <text x="210" y="286" font-size="12" fill="#eef1f6">提炼稳定偏好 / 事实 / 处理方式，一条一文件，带 priority 门控</text>

  <path d="M420 300 L420 325" stroke="#5aa9c9" stroke-width="2"/>
  <path d="M410 325 L420 335 L430 325 Z" fill="#5aa9c9"/>

  <!-- L2 -->
  <rect x="250" y="340" width="380" height="70" rx="10" fill="url(#g2)"/>
  <text x="270" y="372" font-size="15" font-weight="700" fill="#ffffff">L2 · 场景块（scenes/）</text>
  <text x="270" y="396" font-size="12" fill="#eef1f6">多个原子围绕同一上下文凝聚成的可复用经验，含 summary 索引</text>

  <path d="M420 410 L420 435" stroke="#8a69d4" stroke-width="2"/>
  <path d="M410 435 L420 445 L430 435 Z" fill="#8a69d4"/>

  <!-- L3 -->
  <rect x="300" y="450" width="280" height="54" rx="10" fill="url(#g3)"/>
  <text x="320" y="476" font-size="15" font-weight="700" fill="#ffffff">L3 · 用户画像（persona.md）</text>
  <text x="320" y="496" font-size="11" fill="#fdeef4">稳定的跨领域偏好，每次会话读取的核心（≤3KB）</text>

  <!-- right annotation: injection -->
  <rect x="600" y="230" width="230" height="180" rx="10" fill="#ffffff" stroke="#c7cbe0"/>
  <text x="615" y="256" font-size="13" font-weight="700" fill="#3a3f56">每次会话如何复用</text>
  <line x1="615" y1="268" x2="815" y2="268" stroke="#e2e4f0"/>
  <text x="615" y="292" font-size="12" fill="#4a4f66">· 注入 persona（完整、短）</text>
  <text x="615" y="316" font-size="12" fill="#4a4f66">· 注入命中的高优先原子</text>
  <text x="615" y="340" font-size="12" fill="#4a4f66">· 场景、次要原子按需检索</text>
  <text x="615" y="364" font-size="12" fill="#4a4f66">· 不自动通读全量历史</text>
  <text x="615" y="390" font-size="11" fill="#8b90a5">→ 用户不必每次重复自己</text>

  <text x="440" y="520" text-anchor="middle" font-size="12" font-weight="600" fill="#5b6072">核心：只存"浓缩"，不存"原文" —— 兼顾共享与省 Token</text>
</svg>
